<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت · منصة أ. عادل مصطفى</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --primary: #8B2500;
      --bg: #1c1412;
      --card: #271c19;
      --ink: #fdfcfb;
      --muted: #a89f9b;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .icon {
      width: 4rem;
      height: 4rem;
      background: rgba(139, 37, 0, 0.25);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      color: #ff6b3d;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.75rem 0;
    }
    p {
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin: 0 0 1.5rem 0;
    }
    .notice {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0.75rem;
      padding: 0.875rem;
      font-size: 0.8125rem;
      color: #ffb499;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 0.9375rem;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>أنت غير متصل بالإنترنت حالياً</h1>
    <p>يبدو أنك فقدت الاتصال بشبكة الإنترنت. يمكنك الاستمرار في مراجعة الصفحات المحفوظة مسبقاً.</p>
    <div class="notice">
      تنويه أمني: حصص البث المباشر والمحاضرات المشفرة تتطلب اتصالاً مباشراً بالإنترنت ولا يتم تخزينها دون اتصال.
    </div>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
