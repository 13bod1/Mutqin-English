name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel Authentication
        id: check-token
        run: |
          if vercel whoami --token="${{ secrets.VERCEL_TOKEN }}" >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Vercel token is valid."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel token is invalid or not configured. Production deployment is handled automatically by native Vercel GitHub integration."
          fi

      - name: Pull Vercel Environment Information (Production)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.check-token.outputs.valid == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Production)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.check-token.outputs.valid == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Production)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.check-token.outputs.valid == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Information (Preview)
        if: github.event_name == 'pull_request' && steps.check-token.outputs.valid == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request' && steps.check-token.outputs.valid == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Preview)
        if: github.event_name == 'pull_request' && steps.check-token.outputs.valid == 'true'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
